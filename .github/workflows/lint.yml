name: Repository Linting

on:
  workflow_dispatch:

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify ESLint dependencies
        run: |
          node --version
          npm --version
          npm ls eslint globals

      - name: Run ESLint
        run: npm run lint
